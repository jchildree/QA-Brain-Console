services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    env_file:
      - app/backend/.env
    ports:
      - "4000:4000"
    volumes:
      - ./qa-brain:/srv/qa-brain

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
