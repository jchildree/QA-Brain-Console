server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (BrowserRouter) -- fall back to
    # index.html for any path that isn't a real static asset, or a direct
    # link/refresh on e.g. /cap/CAP-20260101-001.md 404s instead of routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
